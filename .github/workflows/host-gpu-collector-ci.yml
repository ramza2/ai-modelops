name: Host GPU Collector CI

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "deploy/compose/**"
      - ".github/workflows/host-gpu-collector-ci.yml"
      - "docs/observability/**"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "deploy/compose/**"
      - ".github/workflows/host-gpu-collector-ci.yml"

permissions:
  contents: read

jobs:
  integration:
    name: Mock Agent / isolated PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: modelops_test
          POSTGRES_USER: modelops_test
          POSTGRES_PASSWORD: modelops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelops_test -d modelops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MODELOPS_DATABASE_URL: postgresql+asyncpg://modelops_test:modelops_test@127.0.0.1:5432/modelops_test
      MODELOPS_HOST_GPU_COLLECTOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install Worker test requirements
        run: |
          python -m pip install -r worker/requirements.txt
          python -m pip install pytest==8.3.5 pytest-asyncio==0.25.3
      - name: Compile Worker source
        run: python -m compileall -q worker/app worker/tests/test_host_gpu_snapshot_collector.py
      - name: Isolated collector tests
        working-directory: worker
        run: python -m pytest -q tests/test_host_gpu_snapshot_collector.py
