name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Vitest / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Isolated Chrome acceptance (Node/GPU snapshots)
        run: node scripts/ux20c2-browser-acceptance.mjs
        env:
          CI_BROWSER_ARTIFACTS: ${{ runner.temp }}/modelops-browser-evidence
          VITE_MODELOPS_API_BASE_URL: ''

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelops-browser-evidence
          path: ${{ runner.temp }}/modelops-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
